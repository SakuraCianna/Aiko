name: Aiko CI/CD

on:
  push:
    branches:
      - main
      - codex/Aiko
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify and build on Windows
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm run test

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Build Electron app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: aiko-electron-build-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 7
